name: Relay bootstrap

# Install (or rotate) the release-runner relay key on the production host,
# restricted to the exact operations the silent-preload relay performs.
# Manual-only, runs from main in the production Environment. Idempotent:
# re-running with the same key is a no-op. Use for the initial relay setup
# and for future relay key rotation.
#
# The matching PRIVATE key is held by the automatic staging-release job and
# must be placed in the `staging` environment as PROD_RELAY_SSH_PRIVATE_KEY
# (with PROD_RELAY_SSH_KNOWN_HOSTS and the PROD_RELAY_HOST variable), never in
# this workflow, repository secrets, or on any host.

on:
  workflow_dispatch:
    inputs:
      relay_public_key:
        description: 'Release-runner relay SSH public key (ssh-ed25519 AAAA... comment). Must be a public key, never a private key. The matching private key goes into the staging environment secret PROD_RELAY_SSH_PRIVATE_KEY.'
        required: true
        type: string

permissions:
  contents: read

jobs:
  install:
    name: Install release-runner relay key on the production host
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "Linux", "X64", "greatsell-ci"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Validate relay public key input
        env:
          RELAY_PUBLIC_KEY: ${{ inputs.relay_public_key }}
        run: |
          set -Eeuo pipefail
          grep -Eq '^[[:space:]]*(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256)[[:space:]]+AAAA[0-9A-Za-z+/]+={0,2}([[:space:]].*)?$' <<<"$RELAY_PUBLIC_KEY" || {
            echo "Input must be a single-line SSH public key (ssh-ed25519/ssh-rsa/ecdsa-sha2), never a private key." >&2
            exit 1
          }
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Configure production SSH
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -Eeuo pipefail
          : "${PROD_DEPLOY_HOST:?Missing production variable PROD_DEPLOY_HOST}"
          : "${PROD_SSH_PRIVATE_KEY:?Missing production secret PROD_SSH_PRIVATE_KEY}"
          : "${PROD_SSH_KNOWN_HOSTS:?Missing production secret PROD_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/greatsell-production-relay-bootstrap"
          chmod 600 "$RUNNER_TEMP/greatsell-production-relay-bootstrap"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${PROD_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Install the relay whitelist wrapper and key on the production host
        env:
          PROD_DEPLOY_HOST: ${{ vars.PROD_DEPLOY_HOST }}
          RELAY_PUBLIC_KEY: ${{ inputs.relay_public_key }}
        run: |
          set -Eeuo pipefail
          # Force-command the reviewed whitelist wrapper (scripts/relay-allow.sh)
          # so this key can only check reachability, docker load, and inspect a
          # greatsellai-hr content ID — never open a shell or publish anything.
          authorized_line="command=\"/home/ubuntu/.relay-allow.sh\",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty $RELAY_PUBLIC_KEY"

          # Deliver the wrapper plus a standalone remote install script by file,
          # not by a heredoc fed straight into ssh, so the runner's script
          # handling cannot silently drop the remote program. The guard below
          # fails loudly if the local heredoc did not materialize.
          remote_script="$RUNNER_TEMP/relay-install.sh"
          cat > "$remote_script" <<'INSTALL'
          set -Eeuo pipefail
          echo "relay-install: started"
          authorized_line="$(cat /tmp/relay-authorized-line)"
          
          # Discover where sshd actually reads authorized_keys for ubuntu, and
          # append to every consulted file with correct ownership/modes. Cloud
          # images often point AuthorizedKeysFile at /etc/ssh/authorized_keys/%u
          # instead of (or in addition to) ~/.ssh/authorized_keys.
          echo "=== sudo capability on production host ==="
          can_sudo=no
          if sudo -n true 2>/dev/null; then can_sudo=yes; echo "passwordless sudo: available"; else echo "passwordless sudo: NOT available (docker-only or none)"; fi
          
          echo "=== effective sshd AuthorizedKeysFile on production host ==="
          authfiles=""
          if sudo -n sshd -T 2>/dev/null | sed -n 's/^authorizedkeysfile //p' | grep -q .; then
            authfiles="$(sudo -n sshd -T 2>/dev/null | sed -n 's/^authorizedkeysfile //p')"
            echo "authorizedkeysfile: $authfiles"
          else
            echo "sshd -T unavailable; using conventional candidates"
            authfiles=".ssh/authorized_keys /etc/ssh/authorized_keys/%u"
          fi
          
          files=()
          for entry in $authfiles; do
            case "$entry" in
              /*) files+=("${entry//%u/ubuntu}") ;;
              *)  files+=("$HOME/${entry//%u/ubuntu}") ;;
            esac
          done
          dedup=()
          for f in "${files[@]}"; do
            seen=0
            for g in "${dedup[@]}"; do [[ "$g" == "$f" ]] && seen=1 && break; done
            [[ "$seen" -eq 0 ]] && dedup+=("$f")
          done
          files=("${dedup[@]}")
          [[ "${#files[@]}" -gt 0 ]] || files=("$HOME/.ssh/authorized_keys")
          
          chmod 755 /home/ubuntu/.relay-allow.sh 2>/dev/null || true
          chown ubuntu:ubuntu /home/ubuntu/.relay-allow.sh 2>/dev/null || true
          
          # Relay dir that the whitelist wrapper restricts all stream/load/rm to.
          echo "=== relay dir ==="
          if [[ "$can_sudo" == "yes" ]]; then
            sudo mkdir -p /var/lib/greatsellai-relay && echo "OK: /var/lib/greatsellai-relay ready"
          else
            mkdir -p /var/lib/greatsellai-relay 2>/dev/null && echo "OK: /var/lib/greatsellai-relay ready (no sudo)" || echo "WARN: cannot create /var/lib/greatsellai-relay"
          fi
          
          for f in "${files[@]}"; do
            echo "--- target: $f ---"
            if [[ "$can_sudo" == "yes" ]]; then
              d="$(dirname "$f")"
              sudo install -d -m 700 -o ubuntu -g ubuntu "$d" 2>/dev/null || true
              if ! sudo test -d "$d" 2>/dev/null; then
                echo "SKIP: cannot prepare directory $d"
                continue
              fi
              if sudo test -e "$f"; then sudo chown ubuntu:ubuntu "$f" 2>/dev/null || true; sudo chmod 600 "$f" 2>/dev/null || true; fi
              if ! sudo grep -qF "$authorized_line" "$f" 2>/dev/null; then
                printf '%s\n' "$authorized_line" | sudo tee -a "$f" >/dev/null
              fi
              sudo chmod 600 "$f" 2>/dev/null || true
              sudo chown ubuntu:ubuntu "$f" 2>/dev/null || true
              if sudo grep -qF "release-relay->production" "$f"; then
                echo "OK: relay key present in $f"
                sudo grep -F "release-relay->production" "$f" | sed 's/\(ssh-[a-z0-9]*\) [^ ]*/\1 <redacted>/'
              else
                echo "FAIL: relay key NOT present in $f"
              fi
            else
              case "$f" in
                "$HOME"/*)
                  mkdir -p "$(dirname "$f")"
                  chmod 700 "$(dirname "$f")"
                  grep -qF "$authorized_line" "$f" 2>/dev/null || printf '%s\n' "$authorized_line" >> "$f"
                  chmod 600 "$f"
                  if grep -qF "release-relay->production" "$f"; then echo "OK: relay key present in $f"; else echo "FAIL: relay key NOT present in $f"; fi
                  ;;
                *)
                  echo "SKIP (no sudo): cannot write $f"
                  ;;
              esac
            fi
          done
          rm -f /tmp/relay-install.sh /tmp/relay-authorized-line
          echo "relay-install: finished"
          INSTALL
          test -s "$remote_script" || { echo "Failed to build remote install script." >&2; exit 1; }
          printf '%s\n' "$authorized_line" > "$RUNNER_TEMP/relay-authorized-line"

          ssh_base=(-i "$RUNNER_TEMP/greatsell-production-relay-bootstrap" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          scp "${ssh_base[@]}" scripts/relay-allow.sh "$PROD_DEPLOY_HOST:/home/ubuntu/.relay-allow.sh"
          scp "${ssh_base[@]}" "$remote_script" "$PROD_DEPLOY_HOST:/tmp/relay-install.sh"
          scp "${ssh_base[@]}" "$RUNNER_TEMP/relay-authorized-line" "$PROD_DEPLOY_HOST:/tmp/relay-authorized-line"
          ssh "${ssh_base[@]}" "$PROD_DEPLOY_HOST" "bash /tmp/relay-install.sh"
