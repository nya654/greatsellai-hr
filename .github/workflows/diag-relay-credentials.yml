name: Relay credential diagnostics

# Temporary diagnostic: print ONLY safe derived facts about the relay
# credentials held in the staging Environment (no secret material).
# Safe outputs: byte counts, first token of a line, key-type name,
# whether a check passes, and the derived PUBLIC key.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    name: Relay credential diagnostics
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Inspect relay credential shape
        env:
          PROD_RELAY_HOST: ${{ vars.PROD_RELAY_HOST }}
          PROD_RELAY_SSH_PRIVATE_KEY: ${{ secrets.PROD_RELAY_SSH_PRIVATE_KEY }}
          PROD_RELAY_SSH_KNOWN_HOSTS: ${{ secrets.PROD_RELAY_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          umask 077
          : "${PROD_RELAY_HOST:?Missing staging-env variable PROD_RELAY_HOST}"
          : "${PROD_RELAY_SSH_PRIVATE_KEY:?Missing staging-env secret PROD_RELAY_SSH_PRIVATE_KEY}"
          : "${PROD_RELAY_SSH_KNOWN_HOSTS:?Missing staging-env secret PROD_RELAY_SSH_KNOWN_HOSTS}"
          pk="$RUNNER_TEMP/greatsell-prod-relay"
          kh="$RUNNER_TEMP/known_hosts_prod"
          printf '%s\n' "$PROD_RELAY_SSH_PRIVATE_KEY" > "$pk"
          chmod 600 "$pk"
          printf '%s\n' "$PROD_RELAY_SSH_KNOWN_HOSTS" > "$kh"
          relay_ip="${PROD_RELAY_HOST#*@}"

          echo "--- relay host ---"
          echo "PROD_RELAY_HOST=${PROD_RELAY_HOST}"
          echo "relay_ip=${relay_ip}"

          echo "--- known_hosts slot (PROD_RELAY_SSH_KNOWN_HOSTS) ---"
          echo "bytes=$(wc -c < "$kh")"
          echo "lines=$(grep -c . "$kh" || true)"
          first="$(head -1 "$kh")"
          echo "first_line_field1=${first%% *}"
          echo "first_line_field2=$(echo "$first" | awk '{print $2}')"
          case "$first" in
            -----BEGIN*) echo "shape=PRIVATE_KEY_IN_KNOWN_HOSTS_SLOT" ;;
            "$relay_ip"*) echo "shape=HOSTKEY_LINE" ;;
            *) echo "shape=OTHER" ;;
          esac
          if ssh-keygen -F "$relay_ip" -f "$kh" >/dev/null 2>&1; then
            echo "known_hosts_match=YES"
          else
            echo "known_hosts_match=NO"
          fi

          echo "--- private-key slot (PROD_RELAY_SSH_PRIVATE_KEY) ---"
          echo "bytes=$(wc -c < "$pk")"
          pkfirst="$(head -1 "$pk")"
          case "$pkfirst" in
            -----BEGIN*) echo "shape=PRIVATE_KEY_BLOB" ;;
            "$relay_ip"*) echo "shape=HOSTKEY_IN_PRIVATE_KEY_SLOT" ;;
            *) echo "shape=OTHER" ;;
          esac
          if ssh-keygen -y -f "$pk" >/dev/null 2>&1; then
            echo "private_key_parses=YES"
            echo "derived_pubkey=$(ssh-keygen -y -f "$pk" 2>/dev/null)"
          else
            echo "private_key_parses=NO"
          fi
