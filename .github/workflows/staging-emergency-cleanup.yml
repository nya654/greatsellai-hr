name: Staging emergency disk cleanup

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type CLEAN to free disk on the runner and staging host.
        required: true
        type: string

permissions:
  contents: read

# Temporary operational workflow to free disk space on the self-hosted build
# runner and on the isolated staging host after a disk-full incident. It is
# intentionally disposable: run it from a temp branch, then delete the branch.
jobs:
  cleanup:
    runs-on: [self-hosted, Linux, X64, greatsell-ci]
    steps:
      - name: Validate cleanup confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == "CLEAN" ]] || {
            echo "Confirmation must be CLEAN." >&2
            exit 1
          }
      - name: Runner-side disk check
        run: |
          echo "=== runner df / ==="
          df -h /
          echo "=== runner greatsell images ==="
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep -E 'greatsellai-hr-(api|caddy):' || echo '(none)'
          echo "=== runner docker df ==="
          docker system df 2>/dev/null || true
      - name: Free runner build artifacts
        run: |
          set -Eeuo pipefail
          # Local build artifacts are streamed to staging with docker save|load,
          # so the runner does not need to keep prior generations.
          docker image prune -af || true
          docker builder prune -af || true
          echo "=== runner df / after ==="
          df -h /
      - name: Staging-side disk cleanup
        env:
          STAGING_DEPLOY_HOST: ${{ vars.STAGING_DEPLOY_HOST }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          : "${STAGING_DEPLOY_HOST:?Missing staging variable STAGING_DEPLOY_HOST}"
          : "${STAGING_SSH_PRIVATE_KEY:?Missing staging secret STAGING_SSH_PRIVATE_KEY}"
          : "${STAGING_SSH_KNOWN_HOSTS:?Missing staging secret STAGING_SSH_KNOWN_HOSTS}"
          install -d -m 700 "$HOME/.ssh"
          umask 077
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/staging-cleanup-key"
          chmod 600 "$RUNNER_TEMP/staging-cleanup-key"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -F "${STAGING_DEPLOY_HOST#*@}" -f "$HOME/.ssh/known_hosts" >/dev/null || {
            echo "Staging known_hosts does not contain the configured host." >&2
            exit 1
          }
          ssh -i "$RUNNER_TEMP/staging-cleanup-key" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$STAGING_DEPLOY_HOST" 'sudo -n bash -s' <<'REMOTE'
set -Eeuo pipefail
echo "=== staging df before ==="
df -h /
echo "=== top /var/lib/docker consumers ==="
du -xh --max-depth=1 /var/lib/docker 2>/dev/null | sort -rh | head -8 || true
echo "=== top /home/ubuntu consumers ==="
du -xh --max-depth=1 /home/ubuntu 2>/dev/null | sort -rh | head -8 || true
echo "=== cleaning preflight temp files ==="
rm -f /tmp/greatsell-staging-* 2>/dev/null || true
echo "=== pruning stopped containers ==="
docker container prune -f || true
echo "=== removing superseded greatsell images ==="
docker image ls --format '{{.Repository}}:{{.Tag}}' \
  | grep -E '^greatsellai-hr-(api|caddy):' \
  | while read -r img; do
      echo "removing $img"
      docker image rm "$img" || echo "  (skipping $img)"
    done
echo "=== pruning build cache ==="
docker builder prune -af || true
echo "=== staging df after ==="
df -h /
REMOTE
